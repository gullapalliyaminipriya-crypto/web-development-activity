<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bus and train tickets booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1, h2 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <table border="1" padding="10" spacing="0">
        <tr>
            <th>Ticket Type</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td>Bus Ticket</td>
            <td>$15</td>
            <td>Available</td>
        </tr>
        <tr>
            <td>Train Ticket</td>
            <td>$25</td>
            <td>Available</td>
        </tr>
    </table>
    <form>
        <h2>Book Your Ticket</h2>
        <label for="ticketType">Select Ticket Type:</label>
        <select id="ticketType" name="ticketType">
            <option value="bus">Bus Ticket</option>
            <option value="train">Train Ticket</option>
        </select><br><br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10"><br><br>
        <input type="submit" value="Book Now">
    </form>
    <response>
        <h2>Booking Confirmation</h2>
        <p>Your booking has been successfully processed. Thank you for choosing our service!</p>
    </response>
</body>
</html>
